<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Tour — NYC & Boston 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PipiTour">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--blue:#123456;--gold:#d68c28;--bg:#f4f0e8;--card:#fffdf8;--ink:#1f2933;--muted:#667085;--border:#e4ded1;--green:#12715b;--shadow:0 14px 30px rgba(18,52,86,.12);--radius:24px;--safe-top:env(safe-area-inset-top)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top left, rgba(214,140,40,.18), transparent 28rem),linear-gradient(180deg,#f8f5ee 0%,#f4f0e8 100%);color:var(--ink);font-family:Calibri,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app-shell{max-width:980px;margin:0 auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:50;padding:calc(12px + var(--safe-top)) 16px 12px;background:rgba(244,240,232,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(228,222,209,.7)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-left{display:flex;align-items:center;gap:12px}.mark{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,var(--blue),#2b6598);color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}
h1{font-size:25px;line-height:1;margin:0;color:var(--blue);letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);margin-top:4px}.install-btn{border:0;background:var(--gold);color:white;border-radius:14px;padding:10px 12px;font-weight:800;display:none;box-shadow:0 8px 18px rgba(214,140,40,.25)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:13px 0 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:999px;color:var(--blue);font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.03)}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{padding:16px}.hero{position:relative;overflow:hidden;border-radius:30px;padding:26px;margin:8px 0 18px;background:linear-gradient(135deg,var(--blue),#2a659b 60%,#477aa4);color:white;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.08)}.hero h2{font-size:32px;margin:0 0 8px;letter-spacing:-.04em}.hero p{font-size:16px;line-height:1.45;margin:0;max-width:56ch}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.hero-box{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px}.hero-box b{display:block;font-size:15px}.hero-box span{font-size:13px;opacity:.9}
.section-title{font-size:21px;color:var(--blue);margin:24px 0 12px;letter-spacing:-.02em}.card{background:rgba(255,253,248,.96);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:0 10px 24px rgba(18,52,86,.07)}.day-card{scroll-margin-top:150px}.date{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:900}.area{font-size:12px;color:var(--muted);font-weight:700}h3{font-size:23px;color:var(--blue);margin:5px 0 8px;letter-spacing:-.03em}p{line-height:1.5}
.timeline{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:3px 0 10px;margin-bottom:12px}.timeline::-webkit-scrollbar{display:none}.chip{min-width:106px;background:white;border:1px solid var(--border);border-radius:20px;padding:11px;box-shadow:0 6px 14px rgba(0,0,0,.04);cursor:pointer}.chip .d{font-weight:900;color:var(--blue);font-size:14px}.chip .t{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.25}.chip.today{border-color:var(--gold);outline:3px solid rgba(214,140,40,.20)}
.pill,.map-link{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;margin:4px 4px 4px 0;font-size:14px;text-decoration:none;background:#eef4fb;border:1px solid #d8e7f5;color:var(--blue);font-weight:700}.map-link{background:#fff;color:var(--blue)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:15px;padding:11px 13px;background:var(--blue);color:white;text-decoration:none;font-weight:900;font-size:14px;cursor:pointer}.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--border)}
details{background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;margin:10px 0}summary{cursor:pointer;color:var(--blue);font-weight:900}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:760px){.hero-grid,.two-col,.three-col{grid-template-columns:1fr}.hero h2{font-size:28px}}
.view{display:none}.view.active{display:block}.check{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid #eee}.check:last-child{border-bottom:0}input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}.progress{height:11px;background:#e9e1d4;border-radius:999px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0%}.search{width:100%;border:1px solid var(--border);border-radius:18px;background:#fff;padding:13px 14px;font-size:16px;margin:4px 0 12px}.notice{background:#fff7e8;border:1px solid #eed6a8;border-radius:18px;padding:14px;margin:12px 0;color:#5b3a00}
footer{text-align:center;color:var(--muted);padding:28px}.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:60;width:min(94%,680px);background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:24px;padding:8px;display:flex;justify-content:space-around;box-shadow:0 18px 36px rgba(0,0,0,.15)}.bottom-nav button{border:0;background:transparent;color:var(--blue);font-weight:900;font-size:12px;padding:8px 10px;border-radius:16px}.bottom-nav button.active{background:var(--blue);color:white}
</style>
</head>
<body>
<div class="app-shell">
<header>
  <div class="brand"><div class="brand-left"><div class="mark">✈︎</div><div><h1>Tour</h1><div class="sub">NYC & Boston 2026 Companion</div></div></div><button id="installBtn" class="install-btn">Installa</button></div>
  <div class="tabs">
    <button class="tab active" data-view="timeline">Timeline</button><button class="tab" data-view="today">Oggi</button><button class="tab" data-view="maps">Maps</button><button class="tab" data-view="food">Food</button><button class="tab" data-view="metro">Metro</button><button class="tab" data-view="checklist">Checklist</button><button class="tab" data-view="tips">Tips</button>
  </div>
</header>
<main>
<section class="hero"><h2>East Coast, senza stress</h2><p>Mini app installabile con timeline, mappe, food spots, checklist interattive e consigli insider. Funziona offline dopo la prima apertura.</p><div class="hero-grid"><div class="hero-box"><b>NYC</b><span>29 giu → 9 lug</span></div><div class="hero-box"><b>Boston</b><span>9 lug → 14 lug</span></div><div class="hero-box"><b>Local-first</b><span>checklist salvata</span></div></div></section>
<section id="view-timeline" class="view active"></section><section id="view-today" class="view"></section><section id="view-maps" class="view"></section><section id="view-food" class="view"></section><section id="view-metro" class="view"></section><section id="view-checklist" class="view"></section><section id="view-tips" class="view"></section>
</main><footer>Tour — Illusioni in Viaggio</footer>
<nav class="bottom-nav"><button class="nav active" data-view="timeline">📅<br>Timeline</button><button class="nav" data-view="maps">🗺<br>Maps</button><button class="nav" data-view="food">🍴<br>Food</button><button class="nav" data-view="checklist">✅<br>Check</button></nav>
</div>
<script>
(function(){
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./service-worker.js'); }
let deferredPrompt;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-flex'});installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'});
const places={arlo:"Arlo Midtown, 351 W 38th St, New York, NY",jfk:"JFK Airport Terminal 1",penn:"Moynihan Train Hall at Penn Station, New York",backbay:"Back Bay Station, Boston",revolution:"The Revolution Hotel, 40 Berkeley St, Boston, MA",top:"Top of the Rock, New York",westlight:"Westlight, Brooklyn, NY",pebble:"Pebble Bar, New York",gospel:"First Corinthian Baptist Church, Harlem, New York",fenway:"Fenway Park, Boston",logan:"Boston Logan International Airport"};
const gmaps=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);const route=(from,to)=>"https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(from)+"&destination="+encodeURIComponent(to)+"&travelmode=transit";
const days=[
{date:"29 GIU",iso:"2026-06-29",city:"NYC",title:"Arrivo NYC",area:"Midtown",mood:"Soft landing",desc:"Primo contatto con Manhattan: Times Square, Bryant Park e Hell’s Kitchen. Ritmo leggero dopo il volo.",highlights:["Times Square","Bryant Park","Hell’s Kitchen"],food:["Joe’s Pizza","Los Tacos No.1","Best Bagel & Coffee"],maps:[["Hotel",places.arlo],["JFK → Arlo",route(places.jfk,places.arlo)]]},
{date:"30 GIU",iso:"2026-06-30",city:"NYC",title:"Central Park & MET",area:"Upper East Side",mood:"Cinematografico",desc:"Central Park, Bow Bridge, Bethesda Terrace, MET e Guggenheim esterno.",highlights:["Bow Bridge","Bethesda Terrace","MET","Guggenheim"],food:["Levain Bakery","JG Melon","The Smith"],maps:[["MET","Metropolitan Museum of Art"],["Guggenheim","Solomon R. Guggenheim Museum"]]},
{date:"1 LUG",iso:"2026-07-01",city:"NYC",title:"Midtown & MoMA",area:"Midtown",mood:"Urban skyline",desc:"MoMA, Fifth Avenue, Rockefeller Center, Grand Central e rooftop Pebble Bar.",highlights:["MoMA","Fifth Avenue","Grand Central","Pebble Bar"],food:["Ess-a-Bagel","Shake Shack Madison","Adel's Famous Halal Food"],maps:[["MoMA","Museum of Modern Art New York"],["Pebble Bar",places.pebble]]},
{date:"2 LUG",iso:"2026-07-02",city:"NYC",title:"Downtown Manhattan",area:"Lower Manhattan",mood:"Storico-finanziario",desc:"9/11 Memorial, Oculus, Wall Street, Battery Park e Staten Island Ferry.",highlights:["Oculus","9/11 Memorial","Wall Street","Battery Park"],food:["Pisillo Italian Panini","Eataly Downtown","Joe’s Shanghai"],maps:[["9/11 Memorial","9/11 Memorial New York"],["Staten Island Ferry","Staten Island Ferry Terminal Manhattan"]]},
{date:"3 LUG",iso:"2026-07-03",city:"NYC",title:"Chelsea & High Line",area:"Chelsea",mood:"Contemporaneo",desc:"Chelsea Market, High Line, Hudson Yards, Little Island e scorci sull’Hudson.",highlights:["Chelsea Market","High Line","Hudson Yards","Little Island"],food:["Los Mariscos","Miznon","Very Fresh Noodles"],maps:[["Chelsea Market","Chelsea Market New York"],["High Line","The High Line New York"]]},
{date:"4 LUG",iso:"2026-07-04",city:"NYC",title:"Brooklyn & Fireworks",area:"Brooklyn",mood:"Independence Day",desc:"Brooklyn Bridge, DUMBO, Brooklyn Heights e fuochi del 4 luglio dal waterfront.",highlights:["Brooklyn Bridge","DUMBO","Brooklyn Heights","Fireworks"],food:["Juliana’s Pizza","Time Out Market","Butler"],maps:[["DUMBO","DUMBO Brooklyn"],["Brooklyn Heights","Brooklyn Heights Promenade"]]},
{date:"5 LUG",iso:"2026-07-05",city:"NYC",title:"Harlem & Gospel",area:"Harlem",mood:"Autentico",desc:"Gospel alla First Corinthian Baptist Church, Harlem walk e soul food.",highlights:["First Corinthian Baptist Church","Apollo Theater","Morningside Heights"],food:["Sylvia’s","Red Rooster","Amy Ruth’s"],maps:[["Chiesa Gospel",places.gospel],["Apollo Theater","Apollo Theater Harlem"]]},
{date:"6 LUG",iso:"2026-07-06",city:"NYC",title:"Coney Island",area:"Brooklyn South",mood:"Summer vintage",desc:"Boardwalk, Luna Park, Nathan’s Famous e atmosfera estiva americana.",highlights:["Boardwalk","Luna Park","Nathan’s Famous"],food:["Nathan’s Famous","Totonno’s"],maps:[["Coney Island","Coney Island Brooklyn"],["Nathan’s","Nathan's Famous Coney Island"]]},
{date:"7 LUG",iso:"2026-07-07",city:"NYC",title:"SoHo & Chinatown",area:"Downtown",mood:"Creative NYC",desc:"SoHo, Nolita, Chinatown e Lower East Side.",highlights:["SoHo","Nolita","Chinatown","LES"],food:["Katz’s Delicatessen","Thai Diner","Scarr’s Pizza"],maps:[["Katz’s","Katz's Delicatessen"],["Thai Diner","Thai Diner New York"]]},
{date:"8 LUG",iso:"2026-07-08",city:"NYC",title:"NYC Finale",area:"Skyline",mood:"Final view",desc:"Giornata jolly, Top of the Rock e rooftop finale Westlight.",highlights:["Top of the Rock","Westlight","shopping finale"],food:["Westlight","opzione libera"],maps:[["Top of the Rock",places.top],["Westlight",places.westlight]]},
{date:"9 LUG",iso:"2026-07-09",city:"Boston",title:"Arrivo Boston",area:"Back Bay",mood:"Cambio ritmo",desc:"Amtrak NY→Boston, check-in, Newbury Street e possibile Fenway Park.",highlights:["Back Bay","Newbury Street","Fenway Park"],food:["Tatte Bakery","Shake Shack Fenway"],maps:[["Arlo → Penn",route(places.arlo,places.penn)],["Back Bay → Hotel",route(places.backbay,places.revolution)],["Fenway",places.fenway]]},
{date:"10 LUG",iso:"2026-07-10",city:"Boston",title:"Freedom Trail",area:"Boston storica",mood:"America storica",desc:"Boston Common, Freedom Trail, Quincy Market e North End.",highlights:["Boston Common","Freedom Trail","Quincy Market","North End"],food:["Mike’s Pastry","Modern Pastry","Regina Pizzeria"],maps:[["Freedom Trail","Freedom Trail Boston"],["Quincy Market","Quincy Market Boston"]]},
{date:"11 LUG",iso:"2026-07-11",city:"Boston",title:"Harvard",area:"Cambridge",mood:"Universitario",desc:"Harvard, Harvard Yard, Cambridge e Charles River.",highlights:["Harvard Yard","Charles River"],food:["Flour Bakery","Felipe’s Taqueria"],maps:[["Harvard","Harvard Yard Cambridge"],["Charles River","Charles River Esplanade"]]},
{date:"12 LUG",iso:"2026-07-12",city:"Boston",title:"Waterfront",area:"Seaport",mood:"New England",desc:"Waterfront, Harborwalk, Seaport District e seafood night.",highlights:["Harborwalk","Seaport District"],food:["Neptune Oyster","Row 34","Yankee Lobster"],maps:[["Seaport","Seaport District Boston"],["Row 34","Row 34 Boston"]]},
{date:"13 LUG",iso:"2026-07-13",city:"Boston",title:"Beacon Hill",area:"Boston elegante",mood:"Slow final",desc:"Beacon Hill, Acorn Street, Public Garden e ultima giornata rilassata.",highlights:["Beacon Hill","Acorn Street","Public Garden"],food:["brunch libero"],maps:[["Acorn Street","Acorn Street Boston"],["Public Garden","Boston Public Garden"]]}
];
const checks=["Passaporto","ESTA approvato","Assicurazione viaggio","Carte abilitate USA","Adattatore USA","Powerbank","eSIM / roaming","App Amtrak","Google Maps offline NYC","Google Maps offline Boston","Prenotare Top of the Rock","Prenotare Westlight","Prenotare Pebble Bar","Valutare biglietti Red Sox","Scaricare PDF prenotazioni"];
function $(id){return document.getElementById(id)}function mapHref(v){return v.indexOf("http")===0?v:gmaps(v)}
function setView(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));$("view-"+id).classList.add("active");document.querySelectorAll(".tab,.nav").forEach(t=>t.classList.toggle("active",t.dataset.view===id));window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".tab,.nav").forEach(btn=>btn.addEventListener("click",()=>setView(btn.dataset.view)));
function dayCard(d,i){return `<article class="card day-card" id="day${i}"><div class="date">${d.date} · ${d.city}</div><div class="area">${d.area} · ${d.mood}</div><h3>${d.title}</h3><p>${d.desc}</p><details open><summary>📍 Highlights</summary>${d.highlights.map(x=>`<span class="pill">${x}</span>`).join("")}</details><details><summary>🍴 Food spots</summary>${d.food.map(x=>`<a class="pill" target="_blank" href="${gmaps(x)}">🍴 ${x}</a>`).join("")}</details><details><summary>🗺 Google Maps</summary><div class="actions">${d.maps.map(m=>`<a class="btn secondary" target="_blank" href="${mapHref(m[1])}">${m[0]}</a>`).join("")}</div></details></article>`}
function renderTimeline(){const todayIso=new Date().toISOString().slice(0,10);$("view-timeline").innerHTML=`<h2 class="section-title">Timeline scrollabile</h2><div class="timeline">${days.map((d,i)=>`<div class="chip ${d.iso===todayIso?'today':''}" data-day="${i}"><div class="d">${d.date}</div><div class="t">${d.title}</div></div>`).join("")}</div>${days.map((d,i)=>dayCard(d,i)).join("")}`;document.querySelectorAll(".chip").forEach(chip=>chip.addEventListener("click",()=>{$("day"+chip.dataset.day).scrollIntoView({behavior:"smooth",block:"start"})}))}
function renderToday(){const todayIso=new Date().toISOString().slice(0,10);let i=days.findIndex(d=>d.iso===todayIso);if(i<0)i=0;$("view-today").innerHTML=`<h2 class="section-title">Oggi / Prossima tappa</h2>${dayCard(days[i],i)}<div class="notice">Se la data non coincide col viaggio, questa sezione mostra la prima tappa. Durante il viaggio mostrerà automaticamente il giorno corretto.</div>`}
function renderMaps(){ $("view-maps").innerHTML=`<h2 class="section-title">Google Maps Links</h2><input class="search" id="mapSearch" placeholder="Cerca giorno, luogo, città...">${days.map((d,i)=>`<div class="card searchable" data-search="${(d.date+' '+d.title+' '+d.area+' '+d.city+' '+d.highlights.join(' ')).toLowerCase()}"><div class="date">${d.date}</div><h3>${d.title}</h3><div class="actions">${d.maps.map(m=>`<a class="btn" target="_blank" href="${mapHref(m[1])}">${m[0]}</a>`).join("")}</div></div>`).join("")}`;$("mapSearch").addEventListener("input",e=>filter(".searchable",e.target.value))}
function renderFood(){ $("view-food").innerHTML=`<h2 class="section-title">Food spots</h2><input class="search" id="foodSearch" placeholder="Cerca ristorante, zona, giorno...">${days.map(d=>`<div class="card fooditem" data-search="${(d.date+' '+d.title+' '+d.area+' '+d.food.join(' ')).toLowerCase()}"><div class="date">${d.date}</div><h3>${d.title}</h3>${d.food.map(f=>`<a class="pill" target="_blank" href="${gmaps(f)}">🍴 ${f}</a>`).join("")}</div>`).join("")}`;$("foodSearch").addEventListener("input",e=>filter(".fooditem",e.target.value))}
function filter(sel,q){q=q.toLowerCase();document.querySelectorAll(sel).forEach(el=>el.style.display=el.dataset.search.includes(q)?"block":"none")}
function renderMetro(){ $("view-metro").innerHTML=`<h2 class="section-title">Metro & trasporti</h2><div class="two-col"><div class="card"><h3>🚇 NYC Subway</h3><p>Usa OMNY/contactless ai tornelli. Linee utili: A/C/E, N/Q/R/W, 1/2/3, F.</p></div><div class="card"><h3>🚇 Boston</h3><p>Green Line per centro/Back Bay, Red Line per Harvard/Cambridge, Silver Line per aeroporto.</p></div></div><div class="card"><h3>🚆 Amtrak</h3><p>Northeast Regional 172 · Penn Station → Back Bay. Arrivare 25–30 min prima.</p><div class="actions"><a class="btn" target="_blank" href="${route(places.arlo,places.penn)}">Arlo → Penn</a><a class="btn" target="_blank" href="${route(places.backbay,places.revolution)}">Back Bay → Hotel</a><a class="btn" target="_blank" href="${route(places.revolution,places.logan)}">Hotel → Logan</a></div></div>`}
function renderChecklist(){let saved={};try{saved=JSON.parse(localStorage.getItem("pipitour_checks")||"{}")}catch(e){}const done=checks.filter((_,i)=>saved[i]).length;const pct=Math.round(done/checks.length*100);$("view-checklist").innerHTML=`<h2 class="section-title">Checklist interattiva</h2><div class="card"><b>${done}/${checks.length} completate</b><div class="progress"><div style="width:${pct}%"></div></div>${checks.map((c,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${saved[i]?'checked':''}> <span>${c}</span></label>`).join("")}</div>`;document.querySelectorAll('#view-checklist input').forEach(inp=>inp.addEventListener("change",()=>{let s={};try{s=JSON.parse(localStorage.getItem("pipitour_checks")||"{}")}catch(e){}s[inp.dataset.check]=inp.checked;localStorage.setItem("pipitour_checks",JSON.stringify(s));renderChecklist()}))}
function renderTips(){ $("view-tips").innerHTML=`<h2 class="section-title">Insider Tips</h2><div class="three-col"><div class="card"><h3>NYC</h3><p>Non correre. Alterna indoor/outdoor per caldo e umidità. Evita di mangiare sempre attorno a Times Square.</p></div><div class="card"><h3>Rooftop</h3><p>Smart casual: sneakers pulite e outfit urbano curato. Non serve outfit formale.</p></div><div class="card"><h3>Boston</h3><p>Usala come fase respiro: storia, passeggiate, seafood e quartieri eleganti.</p></div></div><div class="card"><h3>Gospel</h3><p>Arrivare presto, comportamento rispettoso, donazione consigliata.</p></div>`}
renderTimeline();renderToday();renderMaps();renderFood();renderMetro();renderChecklist();renderTips();
})();
</script>
</body>
</html>
